<section
  id="projects"
  class="flex min-h-screen flex-col items-center justify-center gap-14 px-6 py-24"
>
  <h2 class="text-4xl font-bold tracking-tight text-slate-900 sm:text-5xl dark:text-slate-100">
    {{ i18n.dict().projects.title }}
  </h2>
  <div class="grid w-full max-w-6xl gap-6 sm:grid-cols-2 lg:grid-cols-3">
    @for (project of projects(); track project.title) {
      <app-card [url]="project.url">
        <h3 class="text-lg font-semibold text-slate-900 dark:text-slate-100">
          {{ project.title }}
        </h3>
        <p class="mt-2 text-sm leading-relaxed text-slate-600 dark:text-slate-400">
          {{ project.description }}
        </p>
        @if (project.tags?.length) {
          <div class="mt-4 flex flex-wrap gap-2">
            @for (tag of project.tags; track tag) {
              <app-pill [label]="tag" />
            }
          </div>
        }
      </app-card>
    }
  </div>
</section>
