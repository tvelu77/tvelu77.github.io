<section class="flex min-h-screen items-center justify-center px-6">
  <div class="flex flex-col-reverse items-center gap-10 sm:flex-row sm:gap-16">
    <div class="max-w-xl text-center sm:text-left">
      <h1 class="text-6xl font-bold tracking-tight text-slate-900 dark:text-slate-100">
        {{ texts().hello }}
      </h1>
      <p class="mt-3 text-2xl font-medium text-slate-700 dark:text-slate-300">
        {{ texts().intro }} {{ name }},
        <span
          appTypewriter
          [appTypewriter]="titles()"
          class="text-slate-900 dark:text-slate-100"
        ></span>
      </p>
      <p class="mt-3 text-sm leading-relaxed text-slate-600 dark:text-slate-400">
        {{ texts().description }}
      </p>
      <div class="mt-4 flex flex-wrap justify-center gap-2 sm:justify-start">
        @for (skill of skills; track skill) {
          <app-pill [label]="skill" />
        }
      </div>
    </div>
    <app-avatar class="cursor-pointer" [photoUrl]="photoUrl()" (click)="onAvatarClick()" />
  </div>
</section>
