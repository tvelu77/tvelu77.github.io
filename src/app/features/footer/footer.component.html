<footer class="flex flex-col items-center gap-1 px-6 py-10 text-center">
  <p class="text-sm text-slate-600 dark:text-slate-400">&copy; {{ year }} Thomas Velu</p>
  <p
    class="flex flex-wrap items-center justify-center gap-1 text-xs text-slate-500 dark:text-slate-500"
  >
    {{ i18n.dict().footer.builtWith }}
    <a
      [href]="sourceUrl"
      target="_blank"
      rel="noreferrer"
      class="inline-flex items-center gap-1 font-medium text-slate-700 underline underline-offset-2 transition hover:text-slate-900 dark:text-slate-300 dark:hover:text-slate-100"
    >
      <i class="bi bi-git" aria-hidden="true"></i>
      {{ i18n.dict().footer.source }}
    </a>
  </p>
</footer>
