<a
  [attr.href]="url()"
  [attr.target]="url() ? '_blank' : null"
  [attr.rel]="url() ? 'noreferrer' : null"
  class="block rounded-2xl border border-slate-200 bg-white p-6 shadow-lg shadow-slate-950/5 transition hover:border-slate-300 hover:shadow-xl hover:shadow-slate-950/10 dark:border-slate-800 dark:bg-slate-900 dark:hover:border-slate-700 dark:hover:shadow-slate-950/20"
>
  <ng-content />
</a>
