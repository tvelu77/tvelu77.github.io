<button
  type="button"
  (click)="toggle()"
  [attr.aria-label]="dark() ? i18n.dict().theme.toLight : i18n.dict().theme.toDark"
  [title]="dark() ? i18n.dict().theme.toLight : i18n.dict().theme.toDark"
  class="fixed right-4 top-4 z-50 inline-flex h-11 w-11 items-center justify-center rounded-full border border-slate-200 bg-white text-slate-600 shadow-sm transition hover:border-slate-300 hover:text-slate-900 hover:shadow-md dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300 dark:hover:border-slate-600 dark:hover:text-slate-100"
>
  <i class="bi text-xl" [class.bi-sun]="dark()" [class.bi-moon-stars]="!dark()"></i>
</button>
