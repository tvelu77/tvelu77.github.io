<button
  type="button"
  (click)="i18n.setLocale(target())"
  [attr.aria-label]="targetLabel()"
  [title]="targetLabel()"
  class="fixed right-16 top-4 z-50 inline-flex h-11 w-11 items-center justify-center rounded-full border border-slate-200 bg-white text-sm font-semibold uppercase text-slate-600 shadow-sm transition hover:border-slate-300 hover:text-slate-900 hover:shadow-md dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300 dark:hover:border-slate-600 dark:hover:text-slate-100"
>
  {{ target() }}
</button>
